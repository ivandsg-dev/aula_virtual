<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curso de Data Studio - Login</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <main class="welcome-container">
        <h1>Plataforma del Curso de Data Studio</h1>
        <p>Ingresa para acceder al material de las 4 unidades y tus entregas.</p>
        
        <section class="login-box">
            <h2>Iniciar Sesión</h2>
            <form id="loginForm">
                <input type="email" id="loginEmail" placeholder="Correo electrónico" required>
                <input type="password" id="loginPassword" placeholder="Contraseña" required>
                <button type="submit">Ingresar</button>
            </form>
            <p id="errorMessage" style="color: red; display: none;"></p>
        </section>
    </main>

    <!-- PANTALLA DE BLOQUEO: CAMBIO DE CLAVE OBLIGATORIO -->
<div id="pantalla-primer-login" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; justify-content: center; align-items: center; color: white; font-family: sans-serif;">
    <div style="background: #222; padding: 30px; border-radius: 8px; max-width: 400px; width: 90%; text-align: center; border: 1px solid #444;">
        <h2 id="saludo-usuario">🔒 Primer Inicio de Sesión</h2>
        <p>Por seguridad, debes cambiar la contraseña temporal antes de acceder al contenido del curso.</p>
        
        <form id="form-cambio-obligatorio" style="display: flex; flex-direction: column; gap: 15px; margin-top: 20px;">
            <input type="password" id="nueva-clave" placeholder="Nueva contraseña (mínimo 6 caracteres)" required style="padding: 10px; border-radius: 4px; border: 1px solid #555; background: #333; color: white;">
            <input type="password" id="confirmar-clave" placeholder="Confirmar nueva contraseña" required style="padding: 10px; border-radius: 4px; border: 1px solid #555; background: #333; color: white;">
            <button type="submit" style="padding: 10px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Actualizar Contraseña y Entrar</button>
        </form>
        
        <p id="error-cambio-clave" style="color: #ff6b6b; margin-top: 15px; display: none; font-size: 14px;"></p>
    </div>
</div>

    <!-- Eliminamos el contenedor de aquí porque se va a validar en la vista interna del curso -->
<script type="module" src="app.js"></script>
</body>
</html>
