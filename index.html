<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curso de Data Studio - Login</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <main class="welcome-container">
        <h1>Plataforma del Curso de Data Studio</h1>
        <p>Ingresa para acceder al material de las 4 unidades y tus entregas.</p>
        
        <section class="login-box">
            <h2>Iniciar Sesión</h2>
            <form id="loginForm">
                <input type="email" id="loginEmail" placeholder="Correo electrónico" required>
                <input type="password" id="loginPassword" placeholder="Contraseña" required>
                <button type="submit">Ingresar</button>
            </form>
            <p id="errorMessage" style="color: red; display: none;"></p>
        </section>
    </main>
<!-- Pantalla de Cambio Obligatorio de Contraseña (Primer Login) -->
<div id="pantalla-primer-login" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(255,255,255,0.98); z-index: 10000; justify-content: center; align-items: center;">
    <div style="max-width: 400px; width: 90%; padding: 30px; background: white; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border: 1px solid #dee2e6;">
        <h2 style="margin-top: 0; color: #333;">🔒 Actualiza tu contraseña</h2>
        <p style="color: #666; font-size: 14px; margin-bottom: 20px;">Por seguridad, al ser tu primer ingreso al aula virtual debes definir una contraseña personal y secreta.</p>
        
        <form id="form-cambio-obligatorio">
            <div style="margin-bottom: 15px;">
                <label for="nueva-clave" style="display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px;">Nueva Contraseña:</label>
                <input type="password" id="nueva-clave" required minlength="6" placeholder="Mínimo 6 caracteres" style="width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
            </div>
            
            <div style="margin-bottom: 20px;">
                <label for="confirmar-clave" style="display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px;">Confirmar Contraseña:</label>
                <input type="password" id="confirmar-clave" required minlength="6" placeholder="Repite tu contraseña" style="width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
            </div>
            
            <button type="submit" style="width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 15px;">
                Guardar y Entrar al Curso
            </button>
        </form>
        <p id="error-cambio-clave" style="color: red; font-size: 13px; margin-top: 15px; display: none; text-align: center;"></p>
    </div>
</div>
    <script type="module" src="app.js"></script>
</body>
</html>
